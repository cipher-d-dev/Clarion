services:
  - type: web
    name: clarion-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && pnpm turbo run build --filter=@clarion/api...
    startCommand: sh apps/api/start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false
